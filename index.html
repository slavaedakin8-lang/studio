<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e6fd9">
<title>Зимняя студия</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#eef6ff;--card:#fff;--text:#1a2a3f;--muted:#6b819e;--line:#d6e6f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1a2e;--card:#122640;--text:#e6f2ff;--muted:#8fb0cf;--line:#1e3a5a}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom,0px)}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#1e6fd9 0%,#4aa8f0 60%,#9fd8ff 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 30px;border-radius:0 0 26px 26px}
.hero h1{margin:0;font-size:20px}
.hero p{margin:2px 0 0;opacity:.85;font-size:13px}
.hr{display:flex;align-items:center;justify-content:space-between;position:relative}
.snowman{width:60px;height:74px;flex:none}
.flake{position:absolute;top:-10px;color:#fff;opacity:.85;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(170px) rotate(360deg)}}
.tabs{display:flex;background:rgba(255,255,255,.2);border-radius:14px;padding:4px;margin-top:14px}
.tab{flex:1;padding:9px;background:none;color:#fff;opacity:.75;border-radius:11px;border:0}
.tab.on{background:#fff;color:#1e6fd9;opacity:1}
main{max-width:600px;margin:-16px auto 0;padding:0 12px 90px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,20,60,.06)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tn{font-size:28px;font-weight:800;background:linear-gradient(135deg,#1e6fd9,#5bc0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tl{font-size:12px;color:var(--muted)}
h3{margin:22px 4px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.client{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,20,60,.06)}
.av{width:44px;height:44px;flex:none;border-radius:50%;background:linear-gradient(135deg,#1e6fd9,#5bc0ff);color:#fff;display:grid;place-items:center;font-weight:700}
.cinfo{flex:1;min-width:0}
.pbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.pfill{height:100%;background:linear-gradient(90deg,#1e6fd9,#7fd3ff);border-radius:6px}
.small{font-size:13px}.muted{color:var(--muted)}.ok{color:#10b981;font-weight:600}
.wnav{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px;font-weight:600}
.week{background:var(--card);border-radius:18px;padding:4px 14px;box-shadow:0 2px 10px rgba(20,20,60,.06)}
.day{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.dn{width:58px;flex:none;display:flex;flex-direction:column}
.dn b{font-size:16px}.dn span{font-size:12px;color:var(--muted)}
.day.today .dn b{color:#1e6fd9}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-items:center}
.chip{border:0;border-radius:12px;padding:6px 10px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;cursor:pointer;color:#fff}
.chip small{font-size:11px;font-weight:500;opacity:.9}
.chip.free{background:#e3f1ff;color:#1e4f9a}.chip.booked{background:#1e6fd9}.chip.mine{background:#3bb3e6}.chip.done{background:#10b981}
.empty{font-size:13px;color:var(--muted)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
input,select,textarea{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0}
button{font:inherit;padding:9px 14px;border-radius:12px;border:0;background:linear-gradient(135deg,#1e6fd9,#4aa8f0);color:#fff;cursor:pointer;font-weight:600}
button.del{background:#ef4444}
button.alt{background:var(--bg);color:var(--text);border:1px solid var(--line)}
button.ghost{background:none;color:var(--muted);padding:4px 8px;font-weight:400}
.addrow{display:flex;gap:8px;flex-wrap:wrap}.addrow input{flex:1}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}.row select{flex:1}
.fw{width:100%;margin-top:10px}
.opt{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.opt.click{cursor:pointer}.opt.mine{border-color:#1e6fd9}
.pbg{position:absolute;inset:0 auto 0 0;background:rgba(74,168,240,.2)}
.otxt{position:relative;display:flex;justify-content:space-between;gap:8px}.otxt b{color:#1e6fd9}
.voters{position:relative;font-size:12px;color:var(--muted);margin-top:4px}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{flex:1;background:none;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text)}
.auth{margin-top:24px}
.lo{background:rgba(255,255,255,.25);padding:4px 10px;font-size:12px}
.chatbtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:54px;height:54px;border-radius:50%;padding:0;font-size:22px;z-index:40;display:none;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(30,111,217,.35)}
#chat{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);background:var(--card);box-shadow:-8px 0 24px rgba(0,30,80,.18);transform:translateX(100%);transition:transform .25s;z-index:45;display:flex;flex-direction:column}
#chat.open{transform:translateX(0)}
.chh{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
#chatlist{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;align-self:flex-start;background:var(--bg);border-radius:14px;padding:8px 10px;font-size:14px}
.msg.me{align-self:flex-end;background:#1e6fd9;color:#fff}
.msg small{display:block;opacity:.7;font-size:11px}
.chf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.chf input{flex:1}
.banner{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--card);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,30,80,.2);z-index:60;max-width:520px;margin:auto}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:8px;z-index:50;max-width:520px;margin:auto;pointer-events:none}
.tst{background:#17324f;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
html[data-theme="dark"]{--bg:#0b1a2e;--card:#122640;--text:#e6f2ff;--muted:#8fb0cf;--line:#1e3a5a}
html[data-theme="light"]{--bg:#eef6ff;--card:#ffffff;--text:#1a2a3f;--muted:#6b819e;--line:#d6e6f5}
.dotbtn{width:44px;height:44px;border-radius:50%;padding:0;background:rgba(255,255,255,.25);font-size:24px;line-height:1;flex:none}
#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);right:12px;background:var(--card);color:var(--text);border-radius:16px;box-shadow:0 10px 30px rgba(0,30,80,.25);padding:8px;z-index:70;min-width:240px;display:none}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;background:none;color:var(--text);padding:10px 12px;font-weight:500;border-radius:10px}
#menu button:active{background:var(--bg)}
#menu .mh{font-size:12px;color:var(--muted);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<div class="hero">
  <div class="hr">
    <div><h1>❄️ Зимняя студия</h1><p id="sub">Загрузка…</p></div>
    <button class="dotbtn" onclick="toggleMenu()" aria-label="Меню">⋮</button>
  </div>
  <p id="mode" style="margin-top:6px"></p>
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab" data-v="trainer" onclick="setView('trainer')">Тренер</button>
    <button class="tab" data-v="client" onclick="setView('client')">Клиент</button>
  </div>
</div>
<main id="app"><div class="card muted">Загрузка…</div></main>
<button class="chatbtn" id="chatbtn" onclick="toggleChat()" aria-label="Чат">💬</button>
<aside id="chat">
  <div class="chh"><b>💬 Чат студии</b><button class="ghost" onclick="toggleChat()">✕</button></div>
  <div id="chatlist"></div>
  <form class="chf" onsubmit="event.preventDefault();sendChat()"><input id="chatin" placeholder="Сообщение" autocomplete="off"><button>➤</button></form>
</aside>
<div id="banner"></div>
<div id="menu">
  <div class="mh">Тема</div>
  <button onclick="setTheme('light')">☀️ Светлая</button>
  <button onclick="setTheme('dark')">🌙 Тёмная</button>
  <button onclick="setTheme('auto')">⚙️ Как в системе</button>
  <div class="mh">Уведомления</div>
  <button id="mNotify" onclick="toggleNotify()">🔔 Уведомления</button>
  <button onclick="askNotify()">🛎 Разрешить в браузере</button>
  <div class="mh">Аккаунт</div>
  <button onclick="logout()">🚪 Выйти</button>
</div>
<div id="toast"></div>

<script>
const API='https://bvxnqtgjgxihsioicqiq.supabase.co/functions/v1/api';
const TG_BOT='Trenirovatsyaporabot';
const $=id=>document.getElementById(id);
const PLANS=[4,8,12];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dm=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}`;
const fmt=(d,t)=>{const [y,m,dd]=d.split('-');return `${dd}.${m}.${y} ${t}`;};
const uid=()=>Math.random().toString(36).slice(2,9);
const initials=n=>n.split(' ').map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
const EMPTY=()=>({clients:[],slots:[],bookings:[],polls:[]});
const norm=d=>Object.assign(EMPTY(),d||{});
const clone=x=>JSON.parse(JSON.stringify(x));
const slotsSorted=()=>[...db.slots].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const bookedCount=sid=>db.bookings.filter(b=>b.subId===sid&&b.status==='booked').length;
const leftOf=s=>s.total-s.used;
const freeOf=s=>s.total-s.used-bookedCount(s.id);
const getC=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const setC=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

let db=EMPTY(), me=null, token=getC('st_token'), trainerExists=false;
let view='client', currentClient=null, weekOffset=0, selSlot=null, authMode='login';
let dirty=false, saving=false, chatMsgs=[], lastSnap='';

// ---------- связь с сервером ----------
async function api(action,body={}){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_KevvpS9B278CkKcc1V8m8g_a3BQz8tY',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...body})});
  const j=await r.json().catch(()=>({error:'нет ответа от сервера'}));
  if(r.status===401&&token&&action!=='login'){ logoutLocal(); throw new Error('Сессия истекла, войдите снова'); }
  if(!r.ok) throw new Error(j.error||('ошибка '+r.status));
  return j;
}
function save(){ dirty=true; flush(); }
async function flush(){
  if(saving||!dirty||!me) return;
  saving=true; dirty=false;
  try{ await api('save',{state:db}); }
  catch(e){ dirty=true; console.warn(e); saving=false; setTimeout(flush,4000); return; }
  saving=false;
  if(dirty) flush();
}

// ---------- вход и регистрация ----------
function setAuth(m){ authMode=m; render(); }
async function doAuth(){
  const login=$('a-login').value.trim().toLowerCase(), pass=$('a-pass').value;
  try{
    if(authMode==='login'){ return await startSession(await api('login',{login,pass})); }
    const name=$('a-name').value.trim(), role=$('a-role').value;
    await startSession(await api('register',{login,pass,name,role}));
    if(role==='trainer') trainerExists=true;
  }catch(e){
    const d=$('diag'); if(d) d.textContent='Ошибка: '+e.message;
    alert(e.message);
  }
}
async function startSession(r){
  token=r.token; me=r.me;
  if(getC('st_cookie')==='yes') setC('st_token',token);
  view=me.role==='trainer'?'trainer':'client';
  currentClient=me.clientId;
  const s=await api('state');
  me=s.me; db=norm(s.state); lastSnap=JSON.stringify([s.me,s.state]);
  render();
}
async function logout(){ try{ await api('logout'); }catch(e){} logoutLocal(); }
function logoutLocal(){ token=null; me=null; try{localStorage.removeItem('st_token');}catch(e){} render(); }

// ---------- действия ----------
function setView(v){ view=v; render(); }
function selectSlot(id){ selSlot=(selSlot===id)?null:id; render(); }
function shiftWeek(n){ weekOffset+=n; render(); }
function weekDays(){
  const n=new Date(); n.setHours(0,0,0,0);
  n.setDate(n.getDate()-((n.getDay()+6)%7)+weekOffset*7);
  return [...Array(7)].map((_,i)=>{const d=new Date(n); d.setDate(n.getDate()+i); return d;});
}
function addClient(){ const n=$('cname').value.trim(); if(!n) return; db.clients.push({id:uid(),name:n,subs:[]}); save(); render(); }
function sell(cid){ const total=+$('plan-'+cid).value; db.clients.find(c=>c.id===cid).subs.push({id:uid(),total,used:0}); save(); render(); }
function addSlot(){ const d=$('sdate').value,t=$('stime').value; if(!d||!t) return alert('Укажите дату и время'); db.slots.push({id:uid(),date:d,time:t}); save(); render(); }
function book(slotId,cid){
  if(!cid) return alert('Выберите клиента');
  if(db.bookings.some(b=>b.slotId===slotId&&b.clientId===cid&&b.status!=='cancelled')) return alert('Уже записан');
  const c=db.clients.find(x=>x.id===cid); const sub=c.subs.find(s=>freeOf(s)>0);
  if(!sub) return alert('Нет свободных занятий в абонементе');
  db.bookings.push({id:uid(),slotId,clientId:cid,subId:sub.id,status:'booked',ts:Date.now()}); save(); render();
}
function attend(bid){
  const b=db.bookings.find(x=>x.id===bid);
  const sub=db.clients.find(c=>c.id===b.clientId).subs.find(s=>s.id===b.subId);
  b.status='attended'; b.ts=Date.now(); sub.used++; save(); render();
}
function cancel(bid){ const b=db.bookings.find(x=>x.id===bid); b.status='cancelled'; b.ts=Date.now(); save(); render(); }
function addPoll(){
  const q=$('pq').value.trim(), opts=$('po').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!q||opts.length<2) return alert('Нужен вопрос и минимум 2 варианта');
  db.polls.unshift({id:uid(),question:q,options:opts.map(t=>({id:uid(),text:t,voters:[]}))}); save(); render();
}
function vote(pid,oid,cid){
  const p=db.polls.find(x=>x.id===pid); const was=p.options.find(o=>o.id===oid).voters.includes(cid);
  p.options.forEach(o=>o.voters=o.voters.filter(v=>v!==cid));
  if(!was) p.options.find(o=>o.id===oid).voters.push(cid);
  save(); render();
}
function delPoll(pid){ db.polls.find(p=>p.id===pid).deleted=true; save(); render(); }

// ---------- Telegram ----------
async function linkTg(){
  try{
    const r=await api('link');
    window.open(`https://t.me/${TG_BOT}?start=${r.code}`,'_blank');
    toast('Telegram','Нажмите «Старт» в боте, он пришлёт подтверждение');
  }catch(e){ alert(e.message); }
}
function tgCard(){
  if(me&&me.tg) return '';
  return `<div class="card"><div class="dh"><b>📲 Уведомления в Telegram</b></div>
    <div class="small muted">Новые записи, отмены и отметки придут в Telegram.</div>
    <div class="row"><button onclick="linkTg()" style="flex:1">Привязать Telegram</button></div></div>`;
}

// ---------- лента и уведомления ----------
function feedItems(){
  const items=[];
  for(const b of db.bookings){
    if(!b.ts) continue;
    if(me.role==='client'&&b.clientId!==me.clientId) continue;
    const c=db.clients.find(x=>x.id===b.clientId), s=db.slots.find(x=>x.id===b.slotId);
    const lab=s?fmt(s.date,s.time):'занятие', who=c?c.name:'Клиент';
    let t=null;
    if(b.status==='booked') t=['Новая запись',`${who} · ${lab}`];
    if(b.status==='cancelled') t=['Запись отменена',`${who} · ${lab}`];
    if(b.status==='attended') t=['Занятие отмечено',`${who} · ${lab} · списано 1 занятие`];
    if(t) items.push({ts:b.ts,title:t[0],body:t[1]});
  }
  return items.sort((a,b)=>b.ts-a.ts).slice(0,20);
}
function feedHTML(){
  const seen=+(getC('st_seen')||0), items=feedItems();
  const unread=items.filter(i=>i.ts>seen).length;
  const list=items.length?items.map(i=>`<div class="brow"><div><b>${esc(i.title)}</b><div class="small muted">${esc(i.body)}</div></div><span class="small muted">${new Date(i.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<div class="muted small">Пока нет уведомлений</div>';
  return `<div class="card"><div class="dh"><b>🔔 Уведомления${unread?` · <span class="ok">${unread} новых</span>`:''}</b>${unread?'<button class="ghost" onclick="markSeen()">Прочитано</button>':''}</div>${list}</div>`;
}
function markSeen(){ setC('st_seen',String(Date.now())); render(); }
function toast(t,b){
  const el=document.createElement('div'); el.className='tst';
  el.innerHTML=`<b>${esc(t)}</b>${b?'<div class="small">'+esc(b)+'</div>':''}`;
  $('toast').appendChild(el); setTimeout(()=>el.remove(),6000);
}
function notifyChanges(prev,next){
  if(!me) return;
  for(const b of next.bookings){
    const old=prev.bookings.find(x=>x.id===b.id);
    if(me.role==='client'&&b.clientId!==me.clientId) continue;
    const c=next.clients.find(x=>x.id===b.clientId), s=next.slots.find(x=>x.id===b.slotId);
    const lab=s?fmt(s.date,s.time):'занятие', who=c?c.name:'Клиент';
    if(!old&&b.status==='booked') toast(me.role==='trainer'?'Новая запись':'Вы записаны', me.role==='trainer'?`${who} · ${lab}`:lab);
    else if(old&&old.status!==b.status&&b.status==='cancelled') toast('Запись отменена',`${who} · ${lab}`);
    else if(old&&old.status!==b.status&&b.status==='attended') toast('Занятие отмечено',`${lab} · списано 1 занятие`);
  }
}

// ---------- чат ----------
async function loadChat(){
  try{ chatMsgs=(await api('chat')).messages; renderChat(); }catch(e){}
}
function renderChat(){
  const l=$('chatlist'); if(!l) return;
  l.innerHTML=chatMsgs.length?chatMsgs.map(m=>`<div class="msg ${me&&m.login===me.login?'me':''}"><small>${esc(m.name)} · ${new Date(m.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small>${esc(m.text)}</div>`).join(''):'<div class="muted small">Сообщений пока нет</div>';
  l.scrollTop=l.scrollHeight;
}
function toggleChat(){ if(!me) return; $('chat').classList.toggle('open'); loadChat(); }
async function sendChat(){
  const inp=$('chatin'), text=inp.value.trim(); if(!text) return;
  inp.value='';
  try{ await api('chatSend',{text}); await loadChat(); }catch(e){ inp.value=text; alert(e.message); }
}

// ---------- отрисовка ----------
function subBar(s){
  const pct=s.total?Math.round(s.used/s.total*100):0;
  return `<div class="pbar"><div class="pfill" style="width:${pct}%"></div></div><div class="small muted">Абонемент ${s.total}: посещено ${s.used}, осталось <b>${leftOf(s)}</b>, свободно ${freeOf(s)}</div>`;
}
function tile(n,l){ return `<div class="card" style="margin:0"><div class="tn">${n}</div><div class="tl">${l}</div></div>`; }
function weekNav(){ const d=weekDays(); return `<div class="wnav"><button class="alt" onclick="shiftWeek(-1)">‹</button><span>${dm(d[0])} — ${dm(d[6])}</span><button class="alt" onclick="shiftWeek(1)">›</button></div>`; }
function chip(s,mode){
  if(mode==='trainer'){ const n=db.bookings.filter(b=>b.slotId===s.id&&b.status!=='cancelled').length; return `<button class="chip ${n?'booked':'free'}" onclick="selectSlot('${s.id}')">${s.time}<small>${n?n+' зап.':'свободно'}</small></button>`; }
  const b=db.bookings.find(x=>x.slotId===s.id&&x.clientId===currentClient&&x.status!=='cancelled');
  if(b&&b.status==='attended') return `<button class="chip done" onclick="selectSlot('${s.id}')">${s.time}<small>✓ был</small></button>`;
  if(b) return `<button class="chip mine" onclick="selectSlot('${s.id}')">${s.time}<small>вы записаны</small></button>`;
  return `<button class="chip free" onclick="selectSlot('${s.id}')">${s.time}<small>свободно</small></button>`;
}
function weekHTML(mode){
  const days=weekDays(), today=iso(new Date()), names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  return `<div class="week">${days.map((d,i)=>{
    const key=iso(d), chips=slotsSorted().filter(s=>s.date===key).map(s=>chip(s,mode)).join('')||'<span class="empty">нет занятий</span>';
    return `<div class="day ${key===today?'today':''}"><div class="dn"><b>${names[i]}</b><span>${dm(d)}</span></div><div class="chips">${chips}</div></div>`;
  }).join('')}</div>`;
}
function clientSlotAction(s){
  const c=db.clients.find(x=>x.id===currentClient);
  const b=db.bookings.find(x=>x.slotId===s.id&&x.clientId===c.id&&x.status!=='cancelled');
  if(!b) return c.subs.some(x=>freeOf(x)>0)?`<button onclick="book('${s.id}','${c.id}')">Записаться</button>`:'<span class="muted small">Нет свободных занятий</span>';
  if(b.status==='attended') return '<span class="ok">✓ Занятие отмечено</span>';
  return `<span class="ok">Вы записаны</span> <button class="del" onclick="cancel('${b.id}')">Отменить</button>`;
}
function detailHTML(mode){
  const s=db.slots.find(x=>x.id===selSlot); if(!s) return '';
  const head=`<div class="dh"><b>${fmt(s.date,s.time)}</b><button class="ghost" onclick="selectSlot(null)">✕</button></div>`;
  if(mode==='client') return `<div class="card">${head}${clientSlotAction(s)}</div>`;
  const list=db.bookings.filter(b=>b.slotId===s.id&&b.status!=='cancelled').map(b=>{
    const c=db.clients.find(x=>x.id===b.clientId);
    const act=b.status==='attended'?'<span class="ok">✓ был</span>':`<span><button onclick="attend('${b.id}')">Отметить</button> <button class="del" onclick="cancel('${b.id}')">✕</button></span>`;
    return `<div class="brow"><span>${esc(c?c.name:'—')}</span>${act}</div>`;
  }).join('')||'<div class="muted small">Записей нет</div>';
  return `<div class="card">${head}${list}<div class="row"><select id="bc"><option value="">— выбрать клиента —</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><button onclick="book('${s.id}',$('bc').value)">Записать</button></div></div>`;
}
function pollHTML(mode){
  const polls=db.polls.filter(p=>!p.deleted);
  if(!polls.length) return '';
  return '<h3>Опросы</h3>'+polls.map(p=>{
    const total=new Set(p.options.flatMap(o=>o.voters)).size;
    const opts=p.options.map(o=>{
      const pct=total?Math.round(o.voters.length/total*100):0, mine=currentClient&&o.voters.includes(currentClient);
      const names=o.voters.map(v=>{const c=db.clients.find(x=>x.id===v);return c?esc(c.name):'';}).join(', ');
      const click=mode==='client'?`onclick="vote('${p.id}','${o.id}','${currentClient}')"`:'';
      return `<div class="opt ${mode==='client'?'click':''} ${mine?'mine':''}" ${click}><div class="pbg" style="width:${pct}%"></div><div class="otxt"><span>${mine?'✓ ':''}${esc(o.text)}</span><b>${o.voters.length} · ${pct}%</b></div>${mode==='trainer'&&names?`<div class="voters">${names}</div>`:''}</div>`;
    }).join('');
    return `<div class="card"><div class="pq"><b>📊 ${esc(p.question)}</b></div><div class="small muted">Голосов: ${total}</div>${opts}${mode==='trainer'?`<div class="row"><button class="del" onclick="delPoll('${p.id}')">Удалить опрос</button></div>`:''}</div>`;
  }).join('');
}
function trainerHTML(){
  const left=db.clients.reduce((a,c)=>a+c.subs.reduce((x,s)=>x+leftOf(s),0),0);
  const att=db.bookings.filter(b=>b.status==='attended').length, up=db.bookings.filter(b=>b.status==='booked').length;
  const clients=db.clients.map(c=>`<div class="client"><div class="av">${esc(initials(c.name))}</div><div class="cinfo"><b>${esc(c.name)}</b>${c.subs.map(subBar).join('')||'<div class="small muted">Абонементов нет</div>'}<div class="row"><select id="plan-${c.id}">${PLANS.map(p=>`<option value="${p}">${p} занятий</option>`).join('')}</select><button onclick="sell('${c.id}')">Продать</button></div></div></div>`).join('')||'<div class="card muted">Клиентов пока нет</div>';
  return `${tgCard()}${feedHTML()}
    <div class="stats">${tile(db.clients.length,'клиентов')}${tile(left,'занятий осталось')}${tile(att,'проведено')}${tile(up,'записей впереди')}</div>
    <div class="card"><div class="addrow"><input id="cname" placeholder="Имя нового клиента"><button onclick="addClient()">+ Клиент</button></div></div>
    <h3>Клиенты</h3>${clients}
    <h3>Расписание</h3>
    <div class="card"><div class="addrow"><input type="date" id="sdate"><input type="time" id="stime"><button onclick="addSlot()">+ Время</button></div></div>
    ${weekNav()}${weekHTML('trainer')}${detailHTML('trainer')}
    <h3>Новый опрос</h3>
    <div class="card"><input id="pq" placeholder="Вопрос, например: Когда удобно?" class="fw"><textarea id="po" rows="3" placeholder="Каждый вариант с новой строки" class="fw"></textarea><div class="row"><button onclick="addPoll()" style="flex:1">Создать опрос</button></div></div>
    ${pollHTML('trainer')}`;
}
function clientHTML(){
  if(me.role==='client') currentClient=me.clientId;
  else if(!db.clients.find(c=>c.id===currentClient)) currentClient=db.clients[0]?db.clients[0].id:null;
  const c=db.clients.find(x=>x.id===currentClient);
  if(!c) return `${tgCard()}<div class="card muted">Профиль клиента пока не найден. Тренер ещё не добавил клиентов</div>`;
  const picker=me.role==='trainer'?`<select onchange="currentClient=this.value;selSlot=null;render()" class="fw">${db.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:`<b>${esc(c.name)}</b>`;
  return `${tgCard()}${feedHTML()}
    <div class="card">${picker}<div style="margin-top:12px">${c.subs.map(subBar).join('')||'<div class="small muted">Абонемента нет</div>'}</div></div>
    <h3>Расписание</h3>${weekNav()}${weekHTML('client')}${detailHTML('client')}${pollHTML('client')}`;
}
function authHTML(){
  const reg=authMode==='register';
  return `<div class="card auth">
    <div class="seg"><button class="${!reg?'on':''}" onclick="setAuth('login')">Вход</button><button class="${reg?'on':''}" onclick="setAuth('register')">Регистрация</button></div>
    ${reg?'<input id="a-name" placeholder="Ваше имя" class="fw">':''}
    <input id="a-login" placeholder="Логин" autocomplete="username" class="fw">
    <input id="a-pass" type="password" placeholder="Пароль (от 4 символов)" autocomplete="${reg?'new-password':'current-password'}" class="fw">
    ${reg?`<select id="a-role" class="fw"><option value="client">Я клиент</option><option value="trainer" ${trainerExists?'disabled':''}>Я тренер${trainerExists?' (уже зарегистрирован)':''}</option></select>`:''}
    <button onclick="doAuth()" class="fw" style="margin-top:14px">${reg?'Создать аккаунт':'Войти'}</button>
    <div class="small muted" style="margin-top:10px"><span id="diag" style="color:#dc2626"></span></div>
  </div>`;
}
function renderBanner(){
  const el=$('banner'); if(!el) return;
  const need=getC('st_cookie')===null;
  if(!need||!me){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="banner"><b>🍪 Запомнить вход?</b><div class="small muted">Не придётся входить каждый раз на этом устройстве.</div>
    <div class="row"><button onclick="cookieChoice(true)">Разрешить</button><button class="alt" onclick="cookieChoice(false)">Не разрешать</button></div></div>`;
}
function cookieChoice(yes){ setC('st_cookie',yes?'yes':'no'); if(yes&&token) setC('st_token',token); renderBanner(); }
function render(){
  const tabs=$('tabs'), sub=$('sub');
  $('chatbtn').style.display=me?'flex':'none';
  if(!me){
    tabs.style.display='none'; sub.textContent='Вход в систему';
    $('mode').textContent='';
    $('app').innerHTML=authHTML(); renderBanner(); return;
  }
  if(me.role!=='trainer') view='client';
  tabs.style.display='flex';
  document.querySelectorAll('.tab').forEach(t=>{ t.style.display=(me.role==='trainer'||t.dataset.v==='client')?'':'none'; t.classList.toggle('on',t.dataset.v===view); });
  sub.innerHTML=`${esc(me.name)} · <button class="lo" onclick="logout()">Выйти</button>`;
  $('mode').textContent='☁️ Данные сохраняются на сервере';
  $('app').innerHTML=view==='trainer'?trainerHTML():clientHTML();
  renderBanner();
}

// ---------- фоновое обновление ----------
async function refresh(){
  if(!me||dirty||saving) return;
  try{
    const s=await api('state'); const txt=JSON.stringify([s.me,s.state]);
    if(txt===lastSnap) return;
    const next=norm(s.state);
    notifyChanges(db,next);
    db=next; me=s.me; lastSnap=txt; render();
  }catch(e){}
}
function startTimers(){
  setInterval(refresh,6000);
  setInterval(()=>{ if(me&&$('chat').classList.contains('open')) loadChat(); },4000);
}

// ---------- тема и меню ----------
function applyTheme(){
  const t=getC('st_theme')||'auto';
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
}
function setTheme(t){ setC('st_theme',t); applyTheme(); toggleMenu(false); }
function toggleMenu(force){
  const m=$('menu');
  const open=typeof force==='boolean'?force:!m.classList.contains('open');
  m.classList.toggle('open',open);
  const b=$('mNotify');
  if(b) b.textContent='🔔 Уведомления: '+(me&&me.notify===false?'выкл':'вкл');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#menu')&&!e.target.closest('.dotbtn')) $('menu').classList.remove('open');
});
async function toggleNotify(){
  if(!me) return toggleMenu(false);
  const on=me.notify===false;
  try{
    await api('setNotify',{on});
    me.notify=on;
    toggleMenu(false);
    toast(on?'Уведомления включены':'Уведомления выключены', on?'Сообщения придут в Telegram':'Сообщения в Telegram отключены');
  }catch(e){ alert(e.message); }
}

// ---------- запуск ----------
(async function boot(){
  applyTheme();
  try{ trainerExists=(await api('public')).trainerExists; }catch(e){}
  if(token){
    try{ const s=await api('state'); me=s.me; db=norm(s.state); lastSnap=JSON.stringify([s.me,s.state]); }
    catch(e){ token=null; }
  }
  render(); startTimers();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
